persona: genie

# Nexus-side persona for HEADLESS execution. Distinct from the interactive W12:Genie
# Archon, which runs from .claude/personas/genie/CLAUDE.md. Same remit and the same
# memory namespace; this is the scheduled/job-dispatched face of it.

engine:
  default: claude-code
  model: claude-sonnet-4-6
  fallback: null

limits:
  # Higher than scholar's 15: corpus review and dataset inventory walk many files
  # before producing anything. Still bounded — a job that needs more turns than this
  # is a job that should have been decomposed.
  max_turns: 30
  max_budget_usd: 3.00
  timeout_minutes: 25

output:
  format: json
  save_to: .claude/logs/headless/executions/

session:
  persist: false

# MCP requirements — must be present in this persona's mcp.json.
# Verify with: jq '.mcpServers | keys' alfred/.claude/jobs/personas/genie/mcp.json
mcps_required:
  - jarvis-rag
  - jarvis-graphiti
  - scholar-gateway
