persona: scholar

engine:
  default: claude-code
  model: claude-sonnet-4-6
  fallback: null

limits:
  max_turns: 15
  max_budget_usd: 1.50
  timeout_minutes: 10

output:
  format: json
  save_to: .claude/logs/headless/executions/

session:
  persist: false

# MCP requirements — these must be present in the persona mcp.json.
# The executor loads persona-level MCP config via --mcp-config flag.
# Verify with: jq '.mcpServers | keys' alfred/.claude/jobs/personas/scholar/mcp.json
mcps_required:
  - scholar-gateway
