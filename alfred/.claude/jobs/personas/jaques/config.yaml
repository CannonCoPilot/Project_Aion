persona: jaques

# Nexus-side persona for HEADLESS execution. Distinct from the interactive W13:Jaques
# Archon (.claude/personas/jaques/CLAUDE.md); same remit, same memory namespace.
# Scheduled/dispatched face of the Snorkel AI contract work.

engine:
  default: claude-code
  model: claude-sonnet-4-6
  fallback: null

limits:
  # Harbor bundle inspection walks many files before producing anything. Bounded —
  # a job needing more turns than this should have been decomposed.
  max_turns: 30
  max_budget_usd: 3.00
  timeout_minutes: 25

output:
  format: json
  save_to: .claude/logs/headless/executions/

session:
  persist: false

mcps_required:
  - jarvis-rag
  - jarvis-graphiti
