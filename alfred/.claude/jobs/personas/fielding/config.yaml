persona: fielding

# Nexus-side persona for HEADLESS execution. Distinct from the interactive W12:Fielding
# Archon, which runs from .claude/personas/fielding/CLAUDE.md. Same remit and the same
# memory namespace; this is the scheduled/job-dispatched face of it.

engine:
  default: claude-code
  # Same headless model as genie (proven in Nexus). Not the estate's interactive Opus.
  model: claude-sonnet-4-6
  fallback: null

limits:
  # Corpus jobs walk catalogues and many documents before producing anything, as genie's do.
  max_turns: 30
  max_budget_usd: 3.00
  timeout_minutes: 25

output:
  format: json
  save_to: .claude/logs/headless/executions/

session:
  persist: false

# MCP requirements — must be present in this persona's mcp.json.
# Verify with: jq '.mcpServers | keys' alfred/.claude/jobs/personas/fielding/mcp.json
mcps_required:
  - fielding-corpus
  - jarvis-rag
  - jarvis-graphiti
  - scholar-gateway
